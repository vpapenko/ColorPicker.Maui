version: 2
updates:
  # NuGet packages across all .csproj files.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, nuget]
    groups:
      maui:
        patterns:
          - "Microsoft.Maui*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Appium*"
          - "SixLabors.ImageSharp"

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
