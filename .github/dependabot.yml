version: 2
updates:
  # NuGet packages across all .csproj files.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, nuget]
    groups:
      maui:
        patterns:
          - "Microsoft.Maui*"
      skiasharp:
        patterns:
          - "SkiaSharp*"
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Appium*"
    ignore:
      # Microsoft.Maui.* is version-locked to the .NET SDK pinned in global.json
      # (the workload ships a matching MAUI). Letting Dependabot bump it out of
      # lockstep (even a patch) pulls runtime packs the SDK doesn't have -> NU1102.
      # MAUI is upgraded deliberately, together with the SDK, during a migration.
      - dependency-name: "Microsoft.Maui.*"

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
