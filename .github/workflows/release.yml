name: Release

# Triggered by a `vX.Y.Z` (or `vX.Y.Z-preview.N`) tag pushed to the
# repository. Re-runs the full gate (build + UI tests) against the tagged
# commit, then publishes the nupkg + snupkg to nuget.org and creates a
# GitHub Release with auto-drafted notes.
#
# Cutting a release:
#   git tag v2.0.0 && git push origin v2.0.0
#   git tag v2.1.0-preview.1 && git push origin v2.1.0-preview.1

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      pack: true

  publish-nuget:
    name: Publish to nuget.org
    needs: [ build-and-test ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC)
      contents: read
    environment:
      name: nuget-prod
      url: https://www.nuget.org/packages/ColorPicker.Maui
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: nupkgs
      - name: Verify version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver="${{ needs.build-and-test.outputs.package-version }}"
          ver="${ver%.nupkg}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag '$tag' does not match packed version '$ver'."
            exit 1
          fi
          echo "Tag and package version match: $ver"
      - name: NuGet login (OIDC -> short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: VictorPapenko
      - name: Push to nuget.org
        env:
          VERSION: ${{ needs.build-and-test.outputs.package-version }}
        run: |
          for package_id in ColorPicker.Maui.Core ColorPicker.Maui; do
            package="nupkgs/${package_id}.${VERSION}.nupkg"
            if [ ! -f "$package" ]; then
              echo "::error::Expected package not found: $package"
              exit 1
            fi

            lowercase_id="${package_id,,}"
            lowercase_version="${VERSION,,}"
            existing_package="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --output "$existing_package" \
              --write-out "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/${lowercase_id}/${lowercase_version}/${lowercase_id}.${lowercase_version}.nupkg")"

            if [ "$status" = "200" ]; then
              local_commit="$(unzip -p "$package" '*.nuspec' |
                sed -n 's/.*<repository[^>]* commit="\([^"]*\)".*/\1/p' |
                head -n 1)"
              existing_commit="$(unzip -p "$existing_package" '*.nuspec' |
                sed -n 's/.*<repository[^>]* commit="\([^"]*\)".*/\1/p' |
                head -n 1)"
              if [ -z "$local_commit" ] || [ "$local_commit" != "$existing_commit" ]; then
                echo "::error::${package_id} ${VERSION} already exists from commit '${existing_commit:-unknown}', not '$local_commit'."
                rm -f "$existing_package"
                exit 1
              fi
              echo "${package_id} ${VERSION} already exists from the same commit; continuing a safe retry."
            elif [ "$status" != "404" ]; then
              echo "::error::NuGet package lookup for ${package_id} ${VERSION} returned HTTP $status."
              rm -f "$existing_package"
              exit 1
            fi
            rm -f "$existing_package"
          done

          for package_id in ColorPicker.Maui.Core ColorPicker.Maui; do
            dotnet nuget push "nupkgs/${package_id}.${VERSION}.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --no-symbols \
              --skip-duplicate
          done
          dotnet nuget push "nupkgs/*.snupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  github-release:
    name: Create GitHub Release
    needs: [ publish-nuget ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: nupkgs
      - name: Publish release-drafter draft for this tag
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach nupkgs to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
