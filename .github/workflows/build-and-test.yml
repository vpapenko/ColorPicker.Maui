name: Build and test (reusable)

# Reusable workflow: builds the library + sample app for Android/Windows and
# runs the Appium UI tests on Windows. Optionally produces either package or
# a coherent pair. Normal builds use ProjectReference; package builds consume
# Core through the generated nupkg to validate the real distribution boundary.

on:
  workflow_call:
    inputs:
      pack:
        description: "If true, dotnet pack and upload nupkgs as artifact."
        required: false
        default: false
        type: boolean
      package_selection:
        description: "Packages to create: picker, core, or both."
        required: false
        default: both
        type: string
      picker_version:
        description: "ColorPicker.Maui package version. Blank creates a CI preview version."
        required: false
        default: ""
        type: string
      core_version:
        description: "ColorPicker.Maui.Core package version. Blank creates a CI preview version."
        required: false
        default: ""
        type: string
      core_dependency_version:
        description: "NuGet range used by ColorPicker.Maui. Blank pins the generated Core preview exactly."
        required: false
        default: ""
        type: string
    outputs:
      picker-version:
        description: "Version assigned to ColorPicker.Maui, if packed."
        value: ${{ jobs.pack.outputs.picker-version }}
      core-version:
        description: "Version assigned to ColorPicker.Maui.Core, if packed or consumed by Picker."
        value: ${{ jobs.pack.outputs.core-version }}

permissions:
  contents: read

jobs:
  core-tests:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - name: Restore
        run: dotnet restore ColorPicker.Core.Tests/ColorPicker.Core.Tests.csproj
      - name: Test
        run: dotnet test ColorPicker.Core.Tests/ColorPicker.Core.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: dotnet restore ColorPicker.Maui.sln
      - name: Install Android SDK platform (API 36)
        run: dotnet build ColorPicker/ColorPicker.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True
      - name: Build library (Android)
        run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net10.0-android
      - name: Build sample (Android)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net10.0-android

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: |
          dotnet restore ColorPicker.Maui.sln
          dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64 -p:TargetFramework=net10.0-windows10.0.19041.0
          dotnet restore ColorPicker.Core/ColorPicker.Core.csproj
      - name: Build library (Windows)
        run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net10.0-windows10.0.19041.0
      - name: Build sample (Windows)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net10.0-windows10.0.19041.0 -r win-x64

  ui-tests-windows:
    name: UI Tests (Windows)
    runs-on: windows-latest
    needs: [ build-windows ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: |
          dotnet restore ColorPicker.Maui.sln
          dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64 -p:TargetFramework=net10.0-windows10.0.19041.0
          dotnet restore ColorPicker.Core/ColorPicker.Core.csproj
      - name: Build sample (Windows)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net10.0-windows10.0.19041.0 -r win-x64
      - name: Enable Windows Developer Mode
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Install WinAppDriver
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi"
          $msi = Join-Path $env:RUNNER_TEMP "WindowsApplicationDriver.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
      - name: Set screen resolution (GH Windows runner defaults to 1024x768)
        shell: pwsh
        run: |
          # MAUI test app pins window to 1280x1024 in LAYOUT_TEST/SYNC_TEST
          # mode; default monitor clamps to 1024x768. Force a real 1920x1080
          # session so the pinned window is honored and Maximize() in the
          # main fixture gives us a useful viewport.
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
            Write-Host "Display set to 1920x1080"
          } catch {
            Write-Warning "Set-DisplayResolution failed: $($_.Exception.Message)"
          }
      - name: Install Appium
        run: |
          npm install -g appium@2
          appium driver install --source=npm appium-windows-driver@4.4.7
      - name: Start Appium server
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "appium.log"
          $appiumCmd = (Get-Command appium).Source
          # Write a tiny batch wrapper so the redirection happens in cmd itself,
          # not as a Start-Process argument (which silently drops it on .cmd shims).
          $wrapper = Join-Path $env:RUNNER_TEMP "run-appium.bat"
          @"
          @echo off
          "$appiumCmd" --address 127.0.0.1 --port 4723 --log-level info > "$log" 2>&1
          "@ | Set-Content -Path $wrapper -Encoding ASCII
          Start-Process -FilePath $wrapper -WindowStyle Hidden -PassThru | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try { (Invoke-WebRequest -Uri http://127.0.0.1:4723/status -UseBasicParsing).StatusCode; break } catch { Start-Sleep -Seconds 1 }
          }
          echo "APPIUM_LOG=$log" >> $env:GITHUB_ENV
      - name: Run UI tests
        env:
          UITEST_APP_PATH: ${{ github.workspace }}\ColorPickerTestApp\bin\Release\net10.0-windows10.0.19041.0\win-x64\ColorPickerTestApp.exe
        run: dotnet test ColorPicker.UITests/ColorPicker.UITests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-tests.trx"
      - name: Stage appium.log into workspace
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:APPIUM_LOG) {
            $dest = Join-Path $env:GITHUB_WORKSPACE "appium-server.log"
            Copy-Item -Path $env:APPIUM_LOG -Destination $dest -Force
            Write-Host "Copied appium.log to $dest ($((Get-Item $dest).Length) bytes)"
          } else {
            Write-Warning "APPIUM_LOG not set or file missing: $env:APPIUM_LOG"
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            ColorPicker.UITests/TestResults/**
            ColorPicker.UITests/References/**
            appium-server.log
          if-no-files-found: ignore

  pack:
    name: Pack NuGet
    if: ${{ inputs.pack }}
    runs-on: windows-latest
    needs: [ build-android, build-windows, ui-tests-windows ]
    outputs:
      picker-version: ${{ steps.versions.outputs.picker-version }}
      core-version: ${{ steps.versions.outputs.core-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - name: Install MAUI workloads
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet workload install maui-android maui-windows
      - name: Resolve package versions
        id: versions
        shell: pwsh
        env:
          PACKAGE_SELECTION: ${{ inputs.package_selection }}
          REQUESTED_PICKER_VERSION: ${{ inputs.picker_version }}
          REQUESTED_CORE_VERSION: ${{ inputs.core_version }}
          REQUESTED_CORE_DEPENDENCY: ${{ inputs.core_dependency_version }}
        run: |
          if ($env:PACKAGE_SELECTION -notin @("picker", "core", "both")) {
            throw "Unknown package selection '$env:PACKAGE_SELECTION'."
          }

          $previewVersion = "0.0.0-preview.$env:GITHUB_RUN_NUMBER"
          $pickerVersion = if ($env:PACKAGE_SELECTION -eq "core") {
            ""
          } elseif ($env:REQUESTED_PICKER_VERSION) {
            $env:REQUESTED_PICKER_VERSION
          } else {
            $previewVersion
          }
          $coreVersion = if ($env:REQUESTED_CORE_VERSION) { $env:REQUESTED_CORE_VERSION } else { $previewVersion }
          $coreDependency = if ($env:REQUESTED_CORE_DEPENDENCY) {
            $env:REQUESTED_CORE_DEPENDENCY
          } else {
            "[$coreVersion]"
          }

          if ($env:PACKAGE_SELECTION -eq "picker" -and -not $env:REQUESTED_CORE_VERSION) {
            throw "core_version is required when packing Picker without Core."
          }

          "picker-version=$pickerVersion" >> $env:GITHUB_OUTPUT
          "core-version=$coreVersion" >> $env:GITHUB_OUTPUT
          "core-dependency=$coreDependency" >> $env:GITHUB_OUTPUT
          Write-Host "Selection: $env:PACKAGE_SELECTION"
          Write-Host "Picker version: $pickerVersion"
          Write-Host "Core version: $coreVersion"
          Write-Host "Picker Core dependency: $coreDependency"
      - name: Pack
        shell: pwsh
        env:
          PACKAGE_SELECTION: ${{ inputs.package_selection }}
          PICKER_VERSION: ${{ steps.versions.outputs.picker-version }}
          CORE_VERSION: ${{ steps.versions.outputs.core-version }}
          CORE_DEPENDENCY: ${{ steps.versions.outputs.core-dependency }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "nupkgs"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          if ($env:PACKAGE_SELECTION -in @("core", "both")) {
            $env:ColorPickerCoreVersion = $env:CORE_VERSION
            dotnet restore ColorPicker.Core/ColorPicker.Core.csproj
            if ($LASTEXITCODE -ne 0) { throw "Core restore failed." }
            dotnet pack ColorPicker.Core/ColorPicker.Core.csproj `
              --configuration Release `
              --no-restore `
              --output $output `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Core pack failed." }
          }

          if ($env:PACKAGE_SELECTION -in @("picker", "both")) {
            $env:UseCorePackageReference = "true"
            $env:ColorPickerCoreDependencyVersion = $env:CORE_DEPENDENCY
            $env:ColorPickerMauiVersion = $env:PICKER_VERSION
            $config = Join-Path $env:RUNNER_TEMP "ColorPicker-pack.NuGet.config"
            Copy-Item samples/ConsumerSmoke/NuGet.config $config
            dotnet nuget add source $output `
              --name local-colorpicker `
              --configfile $config
            if ($LASTEXITCODE -ne 0) { throw "Local package source registration failed." }

            dotnet restore ColorPicker/ColorPicker.csproj `
              --configfile $config
            if ($LASTEXITCODE -ne 0) { throw "Picker package-mode restore failed." }
            dotnet build ColorPicker/ColorPicker.csproj `
              -t:InstallAndroidDependencies `
              --no-restore `
              -f net10.0-android `
              -p:AcceptAndroidSDKLicenses=True
            if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed." }
            dotnet pack ColorPicker/ColorPicker.csproj `
              --configuration Release `
              --no-restore `
              --output $output `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Picker pack failed." }
          }

          $packages = @(Get-ChildItem $output -Filter "*.nupkg")
          $mauiPackages = @($packages | Where-Object Name -NotLike "ColorPicker.Maui.Core.*")
          $corePackages = @($packages | Where-Object Name -Like "ColorPicker.Maui.Core.*")
          $expectedMaui = if ($env:PACKAGE_SELECTION -in @("picker", "both")) { 1 } else { 0 }
          $expectedCore = if ($env:PACKAGE_SELECTION -in @("core", "both")) { 1 } else { 0 }
          if ($mauiPackages.Count -ne $expectedMaui -or $corePackages.Count -ne $expectedCore) {
            throw "Unexpected package count: Maui=$($mauiPackages.Count)/$expectedMaui Core=$($corePackages.Count)/$expectedCore."
          }
      - name: Upload nupkgs
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nupkgs/*
          if-no-files-found: error
          retention-days: 30

  consumer-smoke:
    name: Consumer Smoke (packed nupkg)
    if: ${{ inputs.pack }}
    runs-on: windows-latest
    needs: [ pack ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.302
      - name: Install MAUI workloads
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet workload install maui-android maui-windows
      - uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ${{ github.workspace }}\nupkgs
      - name: Register local feed (packed artifacts)
        shell: pwsh
        run: |
          dotnet nuget add source "${{ github.workspace }}\nupkgs" `
            --name local-colorpicker `
            --configfile samples/ConsumerSmoke/NuGet.config
      - name: Restore Picker consumers
        if: ${{ inputs.package_selection != 'core' }}
        shell: pwsh
        env:
          PICKER_VERSION: ${{ needs.pack.outputs.picker-version }}
        run: |
          Write-Host "Restoring ConsumerSmoke against ColorPicker.Maui = $env:PICKER_VERSION"
          dotnet restore samples/ConsumerSmoke/ConsumerSmoke.csproj `
            --configfile samples/ConsumerSmoke/NuGet.config `
            -p:ColorPickerVersion=$env:PICKER_VERSION
          Write-Host "Restoring PackageCompatibilitySmoke against ColorPicker.Maui = $env:PICKER_VERSION"
          dotnet restore samples/PackageCompatibilitySmoke/PackageCompatibilitySmoke.csproj `
            --configfile samples/ConsumerSmoke/NuGet.config `
            -p:ColorPickerVersion=$env:PICKER_VERSION
      - name: Restore Core consumer
        if: ${{ inputs.package_selection != 'picker' }}
        shell: pwsh
        env:
          CORE_VERSION: ${{ needs.pack.outputs.core-version }}
        run: |
          Write-Host "Restoring CoreConsumerSmoke against ColorPicker.Maui.Core = $env:CORE_VERSION"
          dotnet restore samples/CoreConsumerSmoke/CoreConsumerSmoke.csproj `
            --configfile samples/ConsumerSmoke/NuGet.config `
            -p:ColorPickerVersion=$env:CORE_VERSION
      - name: Install Android SDK platform (API 36)
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet build ColorPicker/ColorPicker.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True
      - name: Build consumer (Android)
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet build samples/ConsumerSmoke/ConsumerSmoke.csproj --configuration Release --no-restore -f net10.0-android -p:ColorPickerVersion=${{ needs.pack.outputs.picker-version }}
      - name: Build consumer (Windows)
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet build samples/ConsumerSmoke/ConsumerSmoke.csproj --configuration Release --no-restore -f net10.0-windows10.0.19041.0 -p:ColorPickerVersion=${{ needs.pack.outputs.picker-version }}
      - name: Build Core consumer
        if: ${{ inputs.package_selection != 'picker' }}
        run: dotnet build samples/CoreConsumerSmoke/CoreConsumerSmoke.csproj --configuration Release --no-restore -p:ColorPickerVersion=${{ needs.pack.outputs.core-version }}
      - name: Verify package assembly compatibility
        if: ${{ inputs.package_selection != 'core' }}
        run: dotnet run --project samples/PackageCompatibilitySmoke/PackageCompatibilitySmoke.csproj --configuration Release --no-restore -p:ColorPickerVersion=${{ needs.pack.outputs.picker-version }}
      - name: Job summary
        shell: pwsh
        run: |
          "## Consumer smoke passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Selection: **${{ inputs.package_selection }}**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Picker version: **${{ needs.pack.outputs.picker-version }}**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Core version: **${{ needs.pack.outputs.core-version }}**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
