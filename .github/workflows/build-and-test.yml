name: Build and test (reusable)

# Reusable workflow: builds the library + sample app for Android/Windows and
# runs the Appium UI tests on Windows. Optionally produces NuGet packages.
# Called by pr.yml (gate), ci.yml (gate + preview publish), release.yml (gate
# + stable publish).

on:
  workflow_call:
    inputs:
      pack:
        description: "If true, dotnet pack and upload nupkgs as artifact."
        required: false
        default: false
        type: boolean
    outputs:
      package-version:
        description: "Version assigned by MinVer to the packed nupkg."
        value: ${{ jobs.pack.outputs.version }}

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history + tags
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: dotnet restore ColorPicker.Maui.sln
      - name: Build library (Android)
        run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net8.0-android34.0
      - name: Build sample (Android)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-android34.0

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: |
          dotnet restore ColorPicker.Maui.sln
          dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64
      - name: Build library (Windows)
        run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0
      - name: Build sample (Windows)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0 -r win-x64

  ui-tests-windows:
    name: UI Tests (Windows)
    runs-on: windows-latest
    needs: [ build-windows ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: |
          dotnet restore ColorPicker.Maui.sln
          dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64
      - name: Build sample (Windows)
        run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0 -r win-x64
      - name: Enable Windows Developer Mode
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Install WinAppDriver
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi"
          $msi = Join-Path $env:RUNNER_TEMP "WindowsApplicationDriver.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
      - name: Set screen resolution (GH Windows runner defaults to 1024x768)
        shell: pwsh
        run: |
          # MAUI test app pins window to 1280x1024 in LAYOUT_TEST/SYNC_TEST
          # mode; default monitor clamps to 1024x768. Force a real 1920x1080
          # session so the pinned window is honored and Maximize() in the
          # main fixture gives us a useful viewport.
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
            Write-Host "Display set to 1920x1080"
          } catch {
            Write-Warning "Set-DisplayResolution failed: $($_.Exception.Message)"
          }
      - name: Install Appium
        run: |
          npm install -g appium@2
          appium driver install --source=npm appium-windows-driver@4.4.7
      - name: Start Appium server
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "appium.log"
          $appiumCmd = (Get-Command appium).Source
          # Use cmd.exe's own >/2>&1 redirection so the appium.cmd shim's
          # output is actually captured (Start-Process -Redirect* doesn't
          # follow children spawned by the .cmd wrapper).
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c","`"$appiumCmd`" --address 127.0.0.1 --port 4723 > `"$log`" 2>&1" -PassThru | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try { (Invoke-WebRequest -Uri http://127.0.0.1:4723/status -UseBasicParsing).StatusCode; break } catch { Start-Sleep -Seconds 1 }
          }
          echo "APPIUM_LOG=$log" >> $env:GITHUB_ENV
      - name: Run UI tests
        env:
          UITEST_APP_PATH: ${{ github.workspace }}\ColorPickerTestApp\bin\Release\net8.0-windows10.0.19041.0\win-x64\ColorPickerTestApp.exe
        run: dotnet test ColorPicker.UITests/ColorPicker.UITests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-tests.trx"
      - name: Stage appium.log into workspace
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:APPIUM_LOG) {
            $dest = Join-Path $env:GITHUB_WORKSPACE "appium-server.log"
            Copy-Item -Path $env:APPIUM_LOG -Destination $dest -Force
            Write-Host "Copied appium.log to $dest ($((Get-Item $dest).Length) bytes)"
          } else {
            Write-Warning "APPIUM_LOG not set or file missing: $env:APPIUM_LOG"
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ColorPicker.UITests/TestResults/**
            appium-server.log
          if-no-files-found: ignore

  pack:
    name: Pack NuGet
    if: ${{ inputs.pack }}
    runs-on: windows-latest
    needs: [ build-android, build-windows, ui-tests-windows ]
    outputs:
      version: ${{ steps.minver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history + tags
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Restore
        run: dotnet restore ColorPicker/ColorPicker.csproj
      - name: Pack
        id: minver
        shell: pwsh
        run: |
          dotnet pack ColorPicker/ColorPicker.csproj `
            --configuration Release `
            --no-restore `
            --output ${{ github.workspace }}/nupkgs `
            -p:ContinuousIntegrationBuild=true
          $pkg = Get-ChildItem ${{ github.workspace }}/nupkgs -Filter "*.nupkg" | Select-Object -First 1
          if (-not $pkg) { throw "No .nupkg produced." }
          # Filename: ColorPicker.Maui.<version>.nupkg
          $version = $pkg.BaseName -replace '^ColorPicker\.Maui\.', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Packed version: $version"
      - name: Upload nupkgs
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*
          if-no-files-found: error
          retention-days: 30
