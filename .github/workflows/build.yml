name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Install MAUI workloads
      run: dotnet workload install maui-android maui-windows

    - name: Restore dependencies
      run: dotnet restore ColorPicker.Maui.sln

    - name: Build library
      run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net8.0-android34.0

    - name: Build sample app
      run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-android34.0
      
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Install MAUI workloads
      run: dotnet workload install maui-android maui-windows

    - name: Restore dependencies
      run: |
        dotnet restore ColorPicker.Maui.sln
        dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64

    - name: Build library
      run: dotnet build ColorPicker/ColorPicker.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0

    - name: Build sample app
      run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0 -r win-x64

  ui-tests-windows:
    name: UI Tests (Windows)
    runs-on: windows-latest
    needs: [ build-windows ]
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install MAUI workloads
      run: dotnet workload install maui-android maui-windows

    - name: Restore dependencies
      run: |
        dotnet restore ColorPicker.Maui.sln
        dotnet restore ColorPickerTestApp/ColorPickerTestApp.csproj -r win-x64

    - name: Build sample app
      run: dotnet build ColorPickerTestApp/ColorPickerTestApp.csproj --configuration Release --no-restore -f net8.0-windows10.0.19041.0 -r win-x64

    - name: Enable Windows Developer Mode (required by WinAppDriver)
      shell: pwsh
      run: |
        New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force | Out-Null

    - name: Install WinAppDriver
      shell: pwsh
      run: |
        $url = "https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi"
        $msi = Join-Path $env:RUNNER_TEMP "WindowsApplicationDriver.msi"
        Invoke-WebRequest -Uri $url -OutFile $msi
        Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait

    - name: Install Appium and Windows driver
      run: |
        npm install -g appium@2
        appium driver install --source=npm appium-windows-driver

    - name: Start Appium server
      shell: pwsh
      run: |
        $log = Join-Path $env:RUNNER_TEMP "appium.log"
        Start-Process -FilePath "appium" -ArgumentList "--address","127.0.0.1","--port","4723" -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru | Out-Null
        # Wait for the server to become responsive.
        $deadline = (Get-Date).AddSeconds(60)
        while ((Get-Date) -lt $deadline) {
          try { (Invoke-WebRequest -Uri http://127.0.0.1:4723/status -UseBasicParsing).StatusCode; break } catch { Start-Sleep -Seconds 1 }
        }
        echo "APPIUM_LOG=$log" >> $env:GITHUB_ENV

    - name: Run UI tests
      env:
        UITEST_APP_PATH: ${{ github.workspace }}\ColorPickerTestApp\bin\Release\net8.0-windows10.0.19041.0\win-x64\ColorPickerTestApp.exe
      run: dotnet test ColorPicker.UITests/ColorPicker.UITests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-tests.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: |
          ColorPicker.UITests/TestResults/**
          ${{ env.APPIUM_LOG }}
        if-no-files-found: ignore
