name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## What's changed
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: '🚀 Features'
    labels: [feature, enhancement]
  - title: '🐛 Bug fixes'
    labels: [fix, bug]
  - title: '🧪 Tests'
    labels: [test]
  - title: '📚 Documentation'
    labels: [docs, documentation]
  - title: '🏗️ CI / DevOps'
    labels: [ci, devops]
  - title: '⬆️ Dependencies'
    labels: [dependencies]
  - title: '♻️ Refactor / chores'
    labels: [refactor, chore]

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No user-facing changes'

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [feature, enhancement, minor]
  patch:
    labels: [fix, bug, patch, chore, docs, ci, dependencies, refactor]
  default: patch

exclude-labels:
  - skip-changelog
